[package]
name = "coqui-proxy"
version = "0.0.0-alpha.0"
description = "Which proxy a request should use, and a connection through it: the system's proxy settings, PAC and WPAD, bypass rules, proxy login and CONNECT/SOCKS connectors"
readme = "README.md"
edition = "2024"
# boa_engine 0.21 (feature `pac`) needs 1.88; rcgen (tests) needs 1.88.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Boriken-Dev/coqui-proxy"
keywords = ["proxy", "pac", "wpad", "socks", "system"]
categories = ["network-programming"]
# Git dependencies cannot be published to crates.io.
publish = false
exclude = [".*", "*.local.*", "/tools/", "/packaging/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# PAC scripts and WPAD discovery evaluated in-process by the Boa JavaScript engine. Windows asks WinHTTP, which
# needs no engine; elsewhere a PAC location without this feature is an error (or DIRECT, by setting).
pac = ["dep:boa_engine", "dep:boa_gc", "dep:gethostname"]
# `https:` proxies and PAC locations: a rustls client configuration, by default verified by the operating system.
tls = ["dep:rustls", "dep:rustls-platform-verifier"]
# The asynchronous connector (`asynch`), driven by Tokio; with `tls` it also speaks to an `https:` proxy.
tokio = ["dep:tokio", "dep:tokio-rustls"]
# `hyper::Connector`: the asynchronous connector as a `tower` service for hyper's client.
hyper = ["tokio", "dep:hyper", "dep:hyper-util", "dep:tower-service"]
# `relay::Relay`: a loopback HTTP proxy started in-process that sends what it is given through the connector, so an
# HTTP client that cannot take a connector (reqwest) still gets failover, PAC, rules and proxy login.
relay = ["hyper", "tokio/sync", "hyper/server", "hyper/client", "hyper/http1", "dep:http-body-util", "dep:bytes", "dep:getrandom", "dep:subtle"]
# `relay::blocking::Relay`: the same relay on `std::net` and its own threads, over the blocking connector, with no
# Tokio.
relay-blocking = ["dep:httparse", "dep:getrandom", "dep:subtle"]
# Negotiate and NTLM proxy and server login: SSPI on Windows, GSSAPI elsewhere (needs the system's GSSAPI library
# and, to build, libclang).
negotiate = ["dep:libgssapi"]
# libproxy, loaded at run time (`system::LibProxySource`); Unix.
libproxy = ["dep:libloading"]

[dependencies]
# URLs and proxy URLs.
http = "1"
# Credentials in a proxy URL.
percent-encoding = "2"
# Basic and Negotiate tokens.
base64 = "0.22"
# Error boilerplate.
thiserror = "2"
# Diagnostics; the application installs the subscriber.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# The addresses of this machine's interfaces, for the `<subnet>` bypass entry.
if-addrs = "0.15"
# CIDR bypass rules.
coqui-net-acl = { git = "https://github.com/Boriken-Dev/coqui-net-acl", rev = "839435acc29b76ec0190b7099f870863313d3fcd" }

# PAC evaluation (feature `pac`); pre-1.0, the only maintained pure-Rust JavaScript engine, no C toolchain needed.
boa_engine = { version = "0.21", optional = true }
# The tracing derive for the state a builtin captures (feature `pac`).
boa_gc = { version = "0.21", optional = true }
# This host's name for `myIpAddress` and WPAD (feature `pac`).
gethostname = { version = "1", optional = true }

# TLS to an `https:` proxy or PAC location (feature `tls`).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }

# The asynchronous connector (feature `tokio`): sockets, timers and `spawn_blocking` for the resolver.
tokio = { version = "1", default-features = false, features = ["net", "io-util", "time", "rt"], optional = true }
# TLS to an `https:` proxy over a Tokio socket (feature `tokio`, used with `tls`).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
# hyper's connector trait surface (feature `hyper`).
hyper = { version = "1", default-features = false, optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "client-legacy"], optional = true }
tower-service = { version = "0.3", optional = true }
# The relay's bodies (feature `relay`).
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
# The relay's per-start credential, from the operating system's random source (features `relay` and `relay-blocking`).
getrandom = { version = "0.3", optional = true }
# Constant-time comparison of the relay's credential (features `relay` and `relay-blocking`).
subtle = { version = "2", default-features = false, optional = true }
# The blocking relay's request and reply heads (feature `relay-blocking`).
httparse = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Credentials",
    "Win32_System_Rpc",
    "Win32_System_SystemInformation",
] }

[target.'cfg(unix)'.dependencies]
libgssapi = { version = "0.11", optional = true }
# Opens libproxy at run time (feature `libproxy`).
libloading = { version = "0.8", optional = true }

[dev-dependencies]
# Test CA and server certificates, generated by each test.
rcgen = "0.14"
tempfile = "3"
# Arbitrary bytes into every decoder.
proptest = "1"
# The asynchronous connector's tests.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
# The hyper connector's tests call it as a service.
tower-service = "0.3"
